# Production overrides — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Note: YAML anchors are per-file; the backend env map is inherited from
# docker-compose.yml via compose merge — only deltas are declared here.
services:
  app:
    environment:
      ENVIRONMENT: production
    volumes: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  frontend:
    build:
      context: ./frontend
      target: runner
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes: []
    command: npm run start

  celery_worker:
    environment:
      ENVIRONMENT: production
    volumes: []

  celery_beat:
    environment:
      ENVIRONMENT: production
    volumes: []

  postgres:
    ports: []

  redis:
    ports: []

  chromadb:
    ports: []

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports: []

  flower:
    profiles:
      - ops
    environment:
      ENVIRONMENT: production
    ports: []
